
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クラス連絡掲示板</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 680px;
      margin: 30px auto;
      padding: 16px;
      background: #f4f6fa;
      color: #222;
    }

    h1 { color: #2457a7; }

    .panel, .post {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin: 14px 0;
      box-shadow: 0 2px 7px #00000010;
    }

    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      margin: 7px 0;
      font-size: 16px;
    }

    textarea { min-height: 100px; }

    button {
      border: 0;
      border-radius: 8px;
      background: #2457a7;
      color: white;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }

    .delete {
      background: #b83232;
      font-size: 13px;
    }

    .meta {
      color: #666;
      font-size: 12px;
    }

    .message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>クラス連絡掲示板</h1>
  <p>クラスのみんなで連絡を共有しよう！</p>
  <p id="status">接続しています...</p>

  <section class="panel">
    <h2>新しい投稿</h2>

    <form id="postForm">
      <label for="name">ニックネーム</label>
      <input
        id="name"
        maxlength="20"
        placeholder="例：たろう"
        required
      >

      <label for="message">メッセージ</label>
      <textarea
        id="message"
        maxlength="500"
        placeholder="連絡事項を書こう"
        required
      ></textarea>

      <button id="submitBtn" disabled>投稿する</button>
    </form>
  </section>

  <h2>みんなの投稿</h2>
  <div id="posts"></div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    // Firebaseの設定
    const firebaseConfig = {
      apiKey: "AIzaSyBV0p2pJT682GGdbPuGGTGIVdJANIrkUB0",
      authDomain: "class-board-82d63.firebaseapp.com",
      projectId: "class-board-82d63",
      storageBucket: "class-board-82d63.firebasestorage.app",
      messagingSenderId: "635646668448",
      appId: "1:635646668448:web:2814053b9a2e02e4a363c5",
      measurementId: "G-S42P8ZBY9S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const status = document.getElementById("status");
    const form = document.getElementById("postForm");
    const submitBtn = document.getElementById("submitBtn");
    const postsDiv = document.getElementById("posts");

    let currentUser = null;
    let unsubscribe = null;

    function showError(error) {
      console.error(error);
      status.textContent =
        "エラーです。Firebaseの設定・ログイン方法・ルールを確認してください。";
    }

    // 匿名ログイン
    signInAnonymously(auth).catch(showError);

    onAuthStateChanged(auth, user => {
      currentUser = user;
      submitBtn.disabled = !user;

      if (!user) {
        status.textContent = "ログインできません。設定を確認してください。";
        return;
      }

      status.textContent = "接続しました。投稿できます。";

      if (unsubscribe) unsubscribe();

      const q = query(
        collection(db, "posts"),
        orderBy("createdAt", "desc"),
        limit(50)
      );

      unsubscribe = onSnapshot(q, snapshot => {
        postsDiv.replaceChildren();

        if (snapshot.empty) {
          postsDiv.textContent = "まだ投稿はありません。";
          return;
        }

        snapshot.forEach(postDoc => {
          const post = postDoc.data();
          const card = document.createElement("article");
          card.className = "post";

          const name = document.createElement("strong");
          name.textContent = post.name || "名無し";

          const message = document.createElement("p");
          message.className = "message";
          message.textContent = post.message || "";

          const meta = document.createElement("div");
          meta.className = "meta";

          const date = post.createdAt?.toDate();

          meta.textContent = date
            ? date.toLocaleString("ja-JP")
            : "投稿日時を処理中...";

          card.append(name, message, meta);

          if (post.authorId === currentUser.uid) {
            const del = document.createElement("button");
            del.className = "delete";
            del.textContent = "自分の投稿を削除";

            del.addEventListener("click", async () => {
              if (!confirm("この投稿を削除しますか？")) return;

              try {
                await deleteDoc(doc(db, "posts", postDoc.id));
              } catch (error) {
                showError(error);
              }
            });

            card.append(del);
          }

          postsDiv.append(card);
        });
      }, showError);
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!currentUser) return;

      const name = document.getElementById("name").value.trim();
      const message = document.getElementById("message").value.trim();

      if (
        !name || !message ||
        name.length > 20 || message.length > 500
      ) {
        alert("名前は20文字以内、メッセージは500文字以内です。");
        return;
      }

      submitBtn.disabled = true;

      try {
        await addDoc(collection(db, "posts"), {
          name,
          message,
          authorId: currentUser.uid,
          createdAt: serverTimestamp()
        });

        document.getElementById("message").value = "";
        status.textContent = "投稿しました！";
      } catch (error) {
        showError(error);
      } finally {
        submitBtn.disabled = !currentUser;
      }
    });
  </script>
</body>
</html>
